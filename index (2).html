
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Strategy FX</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 0.2em;
    }
    p {
      font-size: 1.2em;
      margin-bottom: 1em;
    }
    .links a {
      display: inline-block;
      margin: 0.3em;
      padding: 0.6em 1.2em;
      border-radius: 25px;
      text-decoration: none;
      background-color: #00c6ff;
      color: #000;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    .links a:hover {
      background-color: #0072ff;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Simple Strategy FX</h1>
  <p>Welcome to our simple yet powerful trading strategy hub!</p>
  <div class="links">
    <a href="#">Instagram</a>
    <a href="#">Telegram</a>
    <a href="#">YouTube</a>
  </div>
</body>
</html>
